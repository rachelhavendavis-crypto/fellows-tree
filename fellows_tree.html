<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boston Children's Hospital Department of Ophthalmology Fellowship Family Tree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #eef3f8; color: #1c2b3a; }

  header {
    background: #003087;
    color: white;
    padding: 28px 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-family: system-ui, sans-serif; line-height: 1.5; }
  header p { margin-top: 10px; font-size: 2.4rem; opacity: 1; font-family: 'Georgia', serif; font-style: italic; letter-spacing: 0.5px; line-height: 1.2; }

  #search-bar {
    display: flex;
    justify-content: center;
    padding: 14px 20px;
    background: #dde8f2;
    border-bottom: 1px solid #b8cce0;
  }
  #search-bar input {
    width: 100%;
    max-width: 460px;
    padding: 9px 16px;
    font-size: 0.95rem;
    border: 1px solid #a8c0d6;
    border-radius: 20px;
    outline: none;
    font-family: system-ui, sans-serif;
    background: #fafaf7;
    color: #1c2b3a;
  }
  #search-bar .search-hint {
    font-size: 0.72rem;
    color: #6b7d8e;
    font-family: system-ui, sans-serif;
    text-align: center;
    margin-top: 5px;
  }
  #clear-search {
    display: none;
    background: #003087;
    color: white;
    border: none;
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-family: system-ui, sans-serif;
    cursor: pointer;
    margin-left: 8px;
    white-space: nowrap;
  }
  #clear-search:hover { background: #0072CE; }
  #search-count {
    font-size: 0.8rem;
    color: #6b7d8e;
    font-family: system-ui, sans-serif;
    margin-left: 10px;
    white-space: nowrap;
  }
  #search-bar input:focus { border-color: #003087; box-shadow: 0 0 0 3px rgba(27,50,82,0.12); }

  /* Filter toggle button */
  #filter-toggle {
    background: #f0f4fa;
    color: #003087;
    border: 1.5px solid #c0d4e8;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-family: system-ui, sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  #filter-toggle:hover, #filter-toggle.active { background: #003087; color: #fff; border-color: #003087; }

  /* Filter bar */
  #filter-bar {
    max-width: 1200px;
    margin: 0 auto 14px;
    padding: 0 24px;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  #filter-bar.open { display: flex; }
  .filter-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .filter-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #003087;
    font-family: system-ui, sans-serif;
    white-space: nowrap;
    min-width: 68px;
  }
  .filter-chip {
    background: #f0f4fa;
    color: #1c2b3a;
    border: 1.5px solid #c0d4e8;
    border-radius: 20px;
    padding: 4px 13px;
    font-size: 0.78rem;
    font-family: system-ui, sans-serif;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: #0072CE; background: #ddeaf8; }
  .filter-chip.active {
    background: #003087;
    color: #fff;
    border-color: #003087;
  }
  #filter-reset {
    font-size: 0.75rem;
    color: #0072CE;
    background: none;
    border: none;
    cursor: pointer;
    font-family: system-ui, sans-serif;
    padding: 4px 8px;
    text-decoration: underline;
    display: none;
  }
  #filter-reset:hover { color: #003087; }

  #search-results {
    display: none;
    position: fixed;
    top: 108px;
    left: 50%;
    transform: translateX(-50%);
    width: 460px;
    max-width: 95vw;
    background: #fafaf7;
    border: 1px solid #a8c0d6;
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    z-index: 200;
    max-height: 340px;
    overflow-y: auto;
  }
  .search-result-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    cursor: pointer;
    border-bottom: 1px solid #ddeaf8;
    font-family: system-ui, sans-serif;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: #e8f0fb; }
  .search-result-item .sr-name { font-size: 0.88rem; font-weight: 600; }
  .search-result-item .sr-years { font-size: 0.75rem; color: #6b7d8e; }

  /* Grid layout */
  #page-body { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  .era-section { margin-bottom: 40px; }
  .era-heading {
    font-family: system-ui, sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #0072CE;
    border-bottom: 2px solid #0072CE;
    padding-bottom: 6px;
    margin-bottom: 18px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }

  .person-card {
    background: #fafaf7;
    border: 1px solid #c0d4e8;
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
  }
  .person-card:hover { box-shadow: 0 4px 16px rgba(27,50,82,0.13); border-color: #003087; transform: translateY(-1px); }
  .person-card.selected { border-color: #0072CE; box-shadow: 0 0 0 3px rgba(139,26,26,0.18); }
  .person-card.faculty-card { border-color: #003087; background: #ddeaf8; }

  .card-photo {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    object-fit: cover;
    background: #c8d4e0;
    flex-shrink: 0;
  }
  .card-photo-placeholder {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #c8d4e0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: #3a5a7a;
    font-weight: 700;
    font-family: system-ui, sans-serif;
    flex-shrink: 0;
  }
  .card-name {
    font-size: 0.82rem;
    font-weight: 700;
    line-height: 1.3;
    color: #1c2b3a;
  }
  .card-years {
    font-size: 0.72rem;
    color: #6b7d8e;
    font-family: system-ui, sans-serif;
  }
  .card-trainees-badge {
    font-size: 0.68rem;
    font-family: system-ui, sans-serif;
    background: #003087;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  /* Modal overlay */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,28,39,0.55);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #modal-overlay.open { display: flex; }

  #modal {
    background: #fafaf7;
    border-radius: 14px;
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 12px 48px rgba(0,0,0,0.25);
    position: relative;
  }

  #modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: #6b7d8e;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
  }
  #modal-close:hover { background: #ddeaf8; color: #1c2b3a; }

  .modal-header {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    padding: 28px 28px 20px;
    border-bottom: 1px solid #e0dbd2;
  }
  .modal-photo {
    width: 96px;
    height: 116px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.14);
    background: #c8d4e0;
    flex-shrink: 0;
  }
  .modal-photo-placeholder {
    width: 96px;
    height: 116px;
    border-radius: 8px;
    background: #c8d4e0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: #3a5a7a;
    font-weight: 700;
    font-family: system-ui, sans-serif;
    flex-shrink: 0;
  }
  .modal-meta { flex: 1; }
  .modal-name { font-size: 1.35rem; font-weight: 700; color: #003087; line-height: 1.2; }
  .modal-role {
    display: inline-block;
    margin-top: 6px;
    background: #003087;
    color: white;
    font-size: 0.68rem;
    padding: 2px 9px;
    border-radius: 10px;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .modal-years { margin-top: 7px; font-size: 0.88rem; color: #6b7d8e; font-style: italic; font-family: system-ui, sans-serif; }
  .modal-location { margin-top: 4px; font-size: 0.83rem; color: #4a5a6a; font-family: system-ui, sans-serif; }
  .modal-note { margin-top: 4px; font-size: 0.8rem; color: #8b4a1a; font-style: italic; font-family: system-ui, sans-serif; }

  .modal-body { padding: 20px 28px 28px; }

  .section-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #0072CE;
    border-bottom: 1px solid #e0dbd2;
    padding-bottom: 5px;
    margin-bottom: 12px;
    margin-top: 20px;
    font-family: system-ui, sans-serif;
  }
  .section-label:first-child { margin-top: 0; }

  .lineage-list { display: flex; flex-direction: column; gap: 8px; }
  .lineage-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    background: #eef3f8;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid #c0d4e8;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .lineage-card:hover { border-color: #003087; box-shadow: 0 2px 8px rgba(27,50,82,0.1); }
  .lineage-thumb {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    background: #c8d4e0;
    flex-shrink: 0;
  }
  .lineage-thumb-ph {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #c8d4e0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: #3a5a7a;
    font-family: system-ui, sans-serif;
    flex-shrink: 0;
  }
  .lname { font-size: 0.85rem; font-weight: 600; color: #003087; }
  .lyears { font-size: 0.72rem; color: #6b7d8e; font-family: system-ui, sans-serif; margin-top: 1px; }
  .lloc { font-size: 0.72rem; color: #4a6a7a; font-family: system-ui, sans-serif; font-style: italic; margin-top: 1px; }

  .no-links { font-size: 0.85rem; color: #9aabb8; font-style: italic; font-family: system-ui, sans-serif; padding: 4px 0; }

  @media (max-width: 600px) {
    #page-body { padding: 18px 14px; }
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .modal-header { flex-direction: column; align-items: center; text-align: center; }
  }
</style>
</head>

</div>

<div id="page-body">
  <div id="grid-content"></div>
</div>

  </div>
</div>

  if (!url) return null;
  const m = url.match(/\/file\/d\/([^/]+)\//);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w200`;
  return url;
}

function initials(name) {
  return name.split(' ').filter(w => /[A-Z]/.test(w[0])).slice(0,2).map(w=>w[0]).join('');
}

function makeThumb(person, cls, phCls) {
  const url = driveThumb(person.photo);
  if (url) {
    const img = document.createElement('img');
    img.className = cls;
    img.src = url;
    img.alt = person.name;
    img.onerror = function() {
      const ph = makePh(person, phCls);
      this.parentNode && this.parentNode.replaceChild(ph, this);
    };
    return img;
  }
  return makePh(person, phCls);
}

function makePh(person, cls) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = initials(person.name);
  return d;
}

// Get trainers for a person — Robb's fellows also list Petersen
function getTrainers(id) {
  const p = byId[id];
  if (!p || p.supervisor == null) return [];
  const result = [];
  // Walk up the chain
  let cur = p;
  while (cur && cur.supervisor != null) {
    result.push(cur.supervisor);
    cur = byId[cur.supervisor];
  }
  // If Robb (id=1) is in the chain, also include Petersen (id=2) right after Robb
  if (result.includes(1) && !result.includes(2)) {
    const robbIdx = result.indexOf(1);
    result.splice(robbIdx + 1, 0, 2);
  }
  return result;
}

// Sections to render
const sections = [
  { label: "Program Leadership", ids: [1, 2, 3], faculty: true },
  { label: "Trained by Dr. Robb & Dr. Petersen — 1973 to 2002", ids: people.filter(p => p.supervisor === 1).map(p => p.id) },
  { label: "Trained by Dr. Hunter — 2002 to present", ids: people.filter(p => p.supervisor === 3).map(p => p.id) },
  { label: "Second-Generation Fellows (trained by Boston Children's Hospital alumni)", ids: people.filter(p => p.supervisor && p.supervisor > 3).map(p => p.id) }
];

const grid = document.getElementById('grid-content');

sections.forEach(sec => {
  if (!sec.ids.length) return;
  const section = document.createElement('div');
  section.className = 'era-section';

  const heading = document.createElement('div');
  heading.className = 'era-heading';
  heading.textContent = sec.label;
  section.appendChild(heading);

  const cardGrid = document.createElement('div');
  cardGrid.className = 'card-grid';

  sec.ids.forEach(id => {
    const p = byId[id];
    const card = document.createElement('div');
    card.className = 'person-card' + (sec.faculty ? ' faculty-card' : '');
    card.dataset.id = id;

    card.appendChild(makeThumb(p, 'card-photo', 'card-photo-placeholder'));

    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = p.name;
    card.appendChild(nameEl);

    if (p.years) {
      const yr = document.createElement('div');
      yr.className = 'card-years';
      yr.textContent = p.years;
      card.appendChild(yr);
    }

    const myTrainees = trainees[id] || [];
    if (myTrainees.length > 0) {
      const badge = document.createElement('div');
      badge.className = 'card-trainees-badge';

    card.addEventListener('click', () => openModal(id));

});

// Modal
const overlay = document.getElementById('modal-overlay');
const modalEl = document.getElementById('modal');
document.getElementById('modal-close').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function openModal(id) {
  const p = byId[id];

  // Clear selected state
  document.querySelectorAll('.person-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll(`.person-card[data-id="${id}"]`).forEach(c => c.classList.add('selected'));

  document.getElementById('m-name').textContent = p.name;
  document.getElementById('m-role').textContent = p.role;
  document.getElementById('m-years').textContent = p.years || '';
  document.getElementById('m-location').textContent = p.location || '';
  document.getElementById('m-note').textContent = p.note || '';

  const wrap = document.getElementById('m-photo-wrap');
  wrap.innerHTML = '';
  wrap.appendChild(makeThumb(p, 'modal-photo', 'modal-photo-placeholder'));

  // Fellowship directors
  const directorsEl = document.getElementById('m-directors');
  directorsEl.innerHTML = '';
  const dirIds = directorMap[id] || [];
  if (!dirIds.length) {
    const no = document.createElement('div');
    no.className = 'no-links';
    no.textContent = 'No fellowship director on record';
    directorsEl.appendChild(no);
  } else {
    dirIds.forEach(did => directorsEl.appendChild(makeLineageCard(byId[did])));
  }

  // Trainers
  const trainersEl = document.getElementById('m-trainers');
  trainersEl.innerHTML = '';
  const trainerIds = getTrainers(id);
  if (!trainerIds.length) {
    const no = document.createElement('div');
    no.className = 'no-links';
    no.textContent = 'No trainer on record';
    trainersEl.appendChild(no);
  } else {
    trainerIds.forEach(tid => trainersEl.appendChild(makeLineageCard(byId[tid])));
  }

  // Trainees
  const traineesEl = document.getElementById('m-trainees');
  traineesEl.innerHTML = '';
  const myTrainees = trainees[id] || [];
  if (!myTrainees.length) {
    const no = document.createElement('div');
    no.className = 'no-links';
    no.textContent = 'No fellows trained on record';
    traineesEl.appendChild(no);
  } else {
    myTrainees.forEach(tid => traineesEl.appendChild(makeLineageCard(byId[tid])));
  }

  overlay.classList.add('open');
  modalEl.scrollTop = 0;
}

function closeModal() {
  overlay.classList.remove('open');
  document.querySelectorAll('.person-card').forEach(c => c.classList.remove('selected'));
}

function makeLineageCard(person) {
  const card = document.createElement('div');
  card.className = 'lineage-card';
  card.appendChild(makeThumb(person, 'lineage-thumb', 'lineage-thumb-ph'));
  const info = document.createElement('div');
  const nm = document.createElement('div');
  nm.className = 'lname';
  nm.textContent = person.name;
  info.appendChild(nm);
  if (person.years) {
    const yr = document.createElement('div');
    yr.className = 'lyears';
    yr.textContent = person.years;
    info.appendChild(yr);
  }
  if (person.location) {
    const loc = document.createElement('div');
    loc.className = 'lloc';
    loc.textContent = person.location;
    info.appendChild(loc);
  }
  card.appendChild(info);
  card.addEventListener('click', () => openModal(person.id));
  return card;
}

// Search
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const clearBtn = document.getElementById('clear-search');
const searchCount = document.getElementById('search-count');

function matches(p, q) {
  return [p.name, p.location, p.years, p.role, p.note].some(f => f && f.toLowerCase().includes(q));
}


searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.style.display = 'none'; return; }
  const hits = people.filter(p => matches(p, q)).slice(0, 12);
  if (!hits.length) { searchResults.style.display = 'none'; return; }
  searchResults.innerHTML = '';
  hits.forEach(p => {
    const item = document.createElement('div');
    item.className = 'search-result-item';
    item.appendChild(makeThumb(p, 'card-photo', 'card-photo-placeholder'));
    const info = document.createElement('div');
    const nm = document.createElement('div');
    nm.className = 'sr-name';
    nm.textContent = p.name;
    info.appendChild(nm);
    if (p.years) {
      const yr = document.createElement('div');
      yr.className = 'sr-years';
      yr.textContent = p.years + (p.location ? ' · ' + p.location : '');
      info.appendChild(yr);
    }
    item.appendChild(info);
    item.addEventListener('click', () => {
      searchResults.style.display = 'none';
      searchInput.value = '';
      openModal(p.id);
    });
    searchResults.appendChild(item);
  });
  searchResults.style.display = 'block';
});

document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) {
    searchResults.style.display = 'none';
  }
});

// ── Filter chips ──────────────────────────────────────────────────────────────
const activeFilters = { era: new Set(), decade: new Set(), setting: new Set(), region: new Set() };

const STATE_REGION = {
  MA:'newengland', ME:'newengland', VT:'newengland', NH:'newengland', CT:'newengland', RI:'newengland',
  NY:'midatlantic', NJ:'midatlantic', PA:'midatlantic', MD:'midatlantic', DC:'midatlantic', VA:'midatlantic', DE:'midatlantic',
  NC:'south', TX:'south', FL:'south', GA:'south', TN:'south', SC:'south', AL:'south', MS:'south', LA:'south', AR:'south', WV:'south', KY:'south',
  OH:'midwest', IL:'midwest', MI:'midwest', IN:'midwest', MO:'midwest', MN:'midwest', WI:'midwest', IA:'midwest', KS:'midwest', NE:'midwest', ND:'midwest', SD:'midwest', OK:'midwest',
  CA:'west', HI:'west', UT:'west', NM:'west', CO:'west', AZ:'west', OR:'west', WA:'west', NV:'west', ID:'west', MT:'west', WY:'west', AK:'west',
};
const INTL_KEYWORDS = ['international','israel','canada','chile','pakistan','abu dhabi','philippines','norway'];

function personRegion(p) {
  const loc = (p.location || '').toLowerCase();
  if (!loc) return null;
  if (INTL_KEYWORDS.some(k => loc.includes(k))) return 'international';
  const stateMatch = p.location.match(/\b([A-Z]{2})\b(?![\w])/g);
  if (stateMatch) {
    for (const s of stateMatch) {
      if (STATE_REGION[s]) return STATE_REGION[s];
    }
  }
  return null;
}

function personEra(p) {
  if (p.supervisor === 1) return 'robb';
  if (p.supervisor === 3) return 'hunter';
  if (p.supervisor !== null) return 'second';
  return null; // Program Leadership — always visible
}

function personDecade(p) {
  const m = (p.years || '').match(/\d{4}/);
  if (!m) return null;
  return String(Math.floor(parseInt(m[0]) / 10) * 10);
}

function personSetting(p) {
  const loc = (p.location || '').toLowerCase();
  if (!loc) return null;
  if (loc.includes('bch') || loc.includes('300 longwood') || loc.includes('423 charles')) return 'bch';
  if (loc.includes('international') || loc.includes('israel') || loc.includes('canada') ||
      loc.includes('chile') || loc.includes('pakistan') || loc.includes('abu dhabi') ||
      loc.includes('philippines')) return 'international';
  if (loc.includes('university') || loc.includes('hospital') || loc.includes('institute') ||
      loc.includes('center') || loc.includes('clinic') || loc.includes('duke') ||
      loc.includes('stanford') || loc.includes('ucsf') || loc.includes('wilmer') ||
      loc.includes('moran') || loc.includes('rady') || loc.includes('laboratory') ||
      loc.includes('weill') || loc.includes('berman')) return 'academic';
  return 'private';
}

function personMatchesChipFilters(p) {
  // Program Leadership: always show regardless of chip filters
  if (p.id <= 3) return true;

  for (const [group, active] of Object.entries(activeFilters)) {
    if (active.size === 0) continue;
    let val;
    if (group === 'era') val = personEra(p);
    else if (group === 'decade') val = personDecade(p);
    else if (group === 'setting') val = personSetting(p);
    else if (group === 'region') val = personRegion(p);
    // null means "no data for this group" — exclude if filter is active
    if (val === null || !active.has(val)) return false;
  }
  return true;
}

let currentSearchQuery = '';

function applyAllFilters() {
  const q = currentSearchQuery;
  const chipActive = Object.values(activeFilters).some(s => s.size > 0);
  const sections = document.querySelectorAll('.era-section');
  let total = 0;

  sections.forEach(section => {
    const cards = section.querySelectorAll('.person-card');
    let visible = 0;
    cards.forEach(card => {
      const id = parseInt(card.dataset.id);
      const p = byId[id];
      if (!p) return;
      const matchesSearch = !q || matches(p, q);
      const matchesChips = personMatchesChipFilters(p);
      if (matchesSearch && matchesChips) { card.style.display = ''; visible++; }
      else card.style.display = 'none';
    });
    section.style.display = visible ? '' : 'none';
    total += visible;
  });

  // Update count & clear button
  const anyFilter = q || chipActive;
  clearBtn.style.display = q ? 'inline-block' : 'none';
  searchCount.textContent = q ? total + ' result' + (total !== 1 ? 's' : '') : '';
  document.getElementById('filter-reset').style.display = chipActive ? 'inline-block' : 'none';
  document.getElementById('filter-count').textContent = chipActive
    ? total + ' fellow' + (total !== 1 ? 's' : '') + ' shown'
    : '';
}

// Rewire Enter search to use combined filter
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    currentSearchQuery = searchInput.value.trim().toLowerCase();
    searchResults.style.display = 'none';
    applyAllFilters();
    searchInput.blur();
  } else if (e.key === 'Escape') {
    currentSearchQuery = '';
    searchInput.value = '';
    applyAllFilters();
  }
});

function clearFilter() {
  currentSearchQuery = '';
  searchInput.value = '';
  applyAllFilters();
}

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const { group, value } = chip.dataset;
    if (activeFilters[group].has(value)) {
      activeFilters[group].delete(value);
      chip.classList.remove('active');
    } else {
      activeFilters[group].add(value);
      chip.classList.add('active');
    }
    applyAllFilters();
  });
});

function toggleFilters() {
  const bar = document.getElementById('filter-bar');
  const btn = document.getElementById('filter-toggle');
  const open = bar.classList.toggle('open');
  btn.classList.toggle('active', open);
  btn.textContent = open ? '✕ Hide Filters' : '⚙ Filters';
}

document.getElementById('filter-reset').addEventListener('click', () => {
  Object.values(activeFilters).forEach(s => s.clear());
  document.querySelectorAll('.filter-chip.active').forEach(c => c.classList.remove('active'));
  applyAllFilters();
});
</script>
